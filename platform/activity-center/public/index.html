<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduVision Activities Hub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="portal-header">
        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
            <a href="/index.html" class="nav-brand">
                <span>✨</span> EduVision
            </a>
            <span class="badge badge-purple">Activities Hub</span>
        </div>
        <div class="nav-controls">
            <span id="playerBadge" class="badge badge-blue" style="display:none;">🎒 Student</span>
            <a id="portalReturnBtn" href="http://localhost:5173/" class="btn btn-secondary btn-sm">
                ← Back to Portal 🎒
            </a>
        </div>
    </header>

    <main class="game-container">
        <div id="funModeBanner" class="alert-banner alert-info" style="display:none; margin-bottom: 20px; justify-content: space-between; align-items: center;">
            <div>🎡 <strong>Free Play Mode:</strong> Play any activity for practice!</div>
            <a id="funBackToPortal" href="http://localhost:5173/" class="btn btn-secondary btn-sm" style="background: white;">
                Back to Portal 🎒
            </a>
        </div>

        <section class="welcome-hero">
            <div class="welcome-hero-avatar">🎡</div>
            <div>
                <h2 style="font-size: 1.35rem; font-weight: 800; color: var(--text-main); margin: 0;">
                    Activities Playground
                </h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin: 4px 0 0 0;">
                    Interactive learning games and creative challenges.
                </p>
            </div>
        </section>

        <div class="category-filters" id="categoryFilters">
            <button class="filter-chip active" data-category="ALL">All (7)</button>
            <button class="filter-chip" data-category="Creative Arts">Creative Arts</button>
            <button class="filter-chip" data-category="Colors & Physics">Color Match</button>
            <button class="filter-chip" data-category="Vision & Reasoning">Spotter</button>
            <button class="filter-chip" data-category="Math">Math & Counting</button>
            <button class="filter-chip" data-category="Spatial">Puzzles</button>
        </div>

        <section class="activities-grid" id="activitiesGrid">
            <!-- Dynamic activities loaded from /api/activities -->
        </section>
    </main>

    <script src="/js/integration.js"></script>
    <script>
        const query = window.location.search;
        const queryParams = new URLSearchParams(query);
        const mode = queryParams.get('mode');
        const returnUrl = queryParams.get('returnUrl') || 'http://localhost:5173/';
        
        const portalReturnBtn = document.getElementById('portalReturnBtn');
        if (portalReturnBtn) {
            portalReturnBtn.href = returnUrl;
        }

        if (mode === 'fun') {
            const banner = document.getElementById('funModeBanner');
            if (banner) {
                banner.style.display = 'flex';
                const funBack = document.getElementById('funBackToPortal');
                if (funBack) funBack.href = returnUrl;
            }
        }

        async function loadActivities() {
            try {
                const res = await fetch('/api/activities');
                const activities = await res.json();
                renderActivities(activities, 'ALL');
                setupFilters(activities);
            } catch (e) {
                console.error(e);
            }
        }

        function renderActivities(list, category) {
            const grid = document.getElementById('activitiesGrid');
            grid.innerHTML = '';

            const filtered = category === 'ALL' ? list : list.filter(a => {
                if (category === 'Geometry & Logic') {
                    return a.category.includes('Logic') || a.category.includes('Geometry') || a.category.includes('Spatial');
                }
                return a.category.includes(category);
            });

            filtered.forEach(act => {
                const card = document.createElement('a');
                card.className = 'activity-card';
                const sep = act.path.includes('?') ? '&' : '?';
                const queryString = query && query.startsWith('?') ? query.slice(1) : query;
                card.href = queryString ? `${act.path}${sep}${queryString}` : act.path;

                card.innerHTML = `
                    <div>
                        <div class="activity-card-icon">${act.icon}</div>
                        <div class="activity-card-category">${act.category}</div>
                        <h3 class="activity-card-title">${act.name}</h3>
                        <p class="activity-card-desc">${act.description}</p>
                    </div>
                    <button class="btn btn-primary" style="width: 100%; margin-top: 12px;">
                        Play Activity ▶️
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function setupFilters(activities) {
            const chips = document.querySelectorAll('.filter-chip');
            chips.forEach(chip => {
                chip.onclick = () => {
                    chips.forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    renderActivities(activities, chip.dataset.category);
                };
            });
        }

        loadActivities();
    </script>
</body>
</html>
