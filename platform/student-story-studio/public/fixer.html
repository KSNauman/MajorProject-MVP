<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Prep - EduVision</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* CSS migrated to style.css */
    </style>
</head>
<body class="fixer-layout">

    <div class="fixer-navbar">
        <div class="navbar-brand">
            <a id="back-btn" href="/" class="btn btn-secondary" style="border: none; box-shadow: none; padding: 8px 12px;"><i class="fa-solid fa-house"></i> Home</a>
            <span style="font-weight: 800; color: var(--color-primary); margin-left: 10px;"><i class="fa-solid fa-paintbrush"></i> Fix Drawing</span>
        </div>
        <div class="nav-actions" style="display: flex; gap: 8px;">
            <input type="file" id="imageUpload" accept="image/*" style="display: none;">
            <button class="btn btn-secondary" onclick="document.getElementById('imageUpload').click()"><i class="fa-solid fa-upload"></i> Upload</button>
            <button class="btn btn-primary" id="btn-save" style="display: none;"><i class="fa-solid fa-check"></i> Done</button>
        </div>
    </div>

    <div class="fixer-body">
        <div class="fixer-toolbar" id="toolbar" style="display: none;">
            <button class="tool-btn active" id="tool-drag" title="Drag Keypoints" onclick="setMode('drag')">
                <i class="fa-solid fa-arrow-pointer"></i>
            </button>
            <button class="tool-btn" id="tool-erase" title="Eraser" onclick="setMode('erase')">
                <i class="fa-solid fa-eraser"></i>
            </button>
            <button class="tool-btn" id="tool-draw" title="Draw Limbs" onclick="setMode('draw')">
                <i class="fa-solid fa-pen"></i>
            </button>
        </div>

        <div class="fixer-canvas-wrapper">
            <canvas id="editorCanvas"></canvas>
            
            <div class="brush-props" id="brush-properties">
                <span style="font-size: 12px; font-weight: 700; color: var(--text-muted)">Brush Size</span>
                <input type="range" id="brush-size" min="1" max="50" value="10" onchange="updateBrushSize()">
            </div>
            
            <div id="upload-placeholder" style="position: absolute; text-align: center; color: var(--text-muted); padding: 20px;">
                <i class="fa-solid fa-cloud-arrow-up" style="font-size: 4rem; margin-bottom: 15px; color: var(--color-sky-blue);"></i>
                <p style="font-weight: 700; font-size: 1.2rem;">Upload an image to start</p>
                <p style="font-size:14px; margin-top:5px; opacity: 0.8;">Scroll to Zoom. Hold ALT to Pan.</p>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <div style="margin-top: 16px; font-weight: 700; color: var(--text-main); font-size: 1.2rem;" id="loading-text">Processing...</div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        // --- Utilities ---
        function showToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.innerText = message;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function showLoading(text) {
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading-overlay').style.display = 'flex';
        }
        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        // --- Canvas & State ---
        let canvas, mainImageObj;
        let currentMode = 'drag';
        let isImageModified = false;
        let isKeypointMoved = false;
        let hasSaved = false;
        
        let kpPoints = {};
        let currentTextureUrl = "";
        let kpLines = [];

        function hasUnsavedWork() {
            return !hasSaved && (isImageModified || isKeypointMoved || (mainImageObj !== undefined && mainImageObj !== null));
        }

        function initCanvas() {
            canvas = new fabric.Canvas('editorCanvas', {
                width: 512,
                height: 512,
                isDrawingMode: false
            });

            // Dynamic returnUrl setup and unsaved work warnings
            const urlParams = new URLSearchParams(window.location.search);
            const returnUrl = urlParams.get('returnUrl');
            const backBtn = document.getElementById('back-btn');
            if (backBtn) {
                if (returnUrl) {
                    backBtn.href = returnUrl;
                    backBtn.innerHTML = '<i class="fa-solid fa-arrow-left"></i> Back to Story';
                } else {
                    backBtn.href = '/';
                    backBtn.innerHTML = '<i class="fa-solid fa-house"></i> Studio Home';
                }

                backBtn.addEventListener('click', (e) => {
                    if (hasUnsavedWork()) {
                        const leave = confirm("You have unsaved changes in your character drawing. Are you sure you want to leave without saving?");
                        if (!leave) {
                            e.preventDefault();
                            return false;
                        }
                    }
                });
            }

            window.addEventListener('beforeunload', (e) => {
                if (hasUnsavedWork()) {
                    e.preventDefault();
                    e.returnValue = 'You have unsaved changes in your character drawing.';
                }
            });
            
            document.getElementById('imageUpload').addEventListener('change', uploadToBackendFirst);
            document.getElementById('btn-save').addEventListener('click', processAndGoToEngine);
            
            // Check for restore
            if (window.location.search.includes('restore=true')) {
                const rTex = sessionStorage.getItem('restore_textureUrl');
                const rKps = sessionStorage.getItem('restore_keypoints');
                if (rTex && rKps) {
                    currentTextureUrl = rTex;
                    document.getElementById('upload-placeholder').style.display = 'none';
                    document.getElementById('toolbar').style.display = 'flex';
                    document.getElementById('btn-save').style.display = 'inline-block';
                    
                    fabric.Image.fromURL(rTex + "?t=" + new Date().getTime(), (img) => {
                        canvas.clear();
                        canvas.setBackgroundColor('#f3f4f6', canvas.renderAll.bind(canvas));
                        img.set({ selectable: false, evented: false });
                        canvas.add(img);
                        mainImageObj = img;
                        
                        let kpsData = JSON.parse(rKps);
                        drawSkeleton(kpsData);
                    });
                }
            }

            
            canvas.on('mouse:wheel', function(opt) {
                var delta = opt.e.deltaY;
                var zoom = canvas.getZoom();
                zoom *= 0.999 ** delta;
                if (zoom > 5) zoom = 5;
                if (zoom < 0.2) zoom = 0.2;
                canvas.zoomToPoint({ x: opt.e.offsetX, y: opt.e.offsetY }, zoom);
                opt.e.preventDefault();
                opt.e.stopPropagation();
            });
            
            // Allow panning when holding Alt
            canvas.on('mouse:down', function(opt) {
                var evt = opt.e;
                if (evt.altKey === true) {
                    this.isDragging = true;
                    this.selection = false;
                    this.lastPosX = evt.clientX;
                    this.lastPosY = evt.clientY;
                }
            });
            canvas.on('mouse:move', function(opt) {
                if (this.isDragging) {
                    var e = opt.e;
                    var vpt = this.viewportTransform;
                    vpt[4] += e.clientX - this.lastPosX;
                    vpt[5] += e.clientY - this.lastPosY;
                    this.requestRenderAll();
                    this.lastPosX = e.clientX;
                    this.lastPosY = e.clientY;
                }
            });
            canvas.on('mouse:up', function(opt) {
                this.setViewportTransform(this.viewportTransform);
                this.isDragging = false;
                this.selection = true;
            });
            
            canvas.on('path:created', () => {
                isImageModified = true;
                if (currentMode === 'erase') {
                    const paths = canvas.getObjects();
                    const lastPath = paths[paths.length - 1];
                    lastPath.globalCompositeOperation = 'destination-out';
                    canvas.renderAll();
                }
            });
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tool-' + mode).classList.add('active');
            
            const brushProps = document.getElementById('brush-properties');
            if (mode === 'draw' || mode === 'erase') {
                brushProps.style.display = 'flex';
                // If user uses drawing tools, hide skeleton permanently and mark modified
                if (!isImageModified) {
                    isImageModified = true;
                    setSkeletonVisibility(false);
                    showToast("Skeleton hidden. Draw limbs or erase background.", false);
                    document.getElementById('btn-save').innerHTML = '<i class="fa-solid fa-arrows-rotate"></i> Re-analyze Drawing';
                }
            } else {
                brushProps.style.display = 'none';
            }

            if (mode === 'drag') {
                canvas.isDrawingMode = false;
            } else if (mode === 'draw') {
                canvas.isDrawingMode = true;
                canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
                canvas.freeDrawingBrush.color = '#000000';
                updateBrushSize();
            } else if (mode === 'erase') {
                canvas.isDrawingMode = true;
                canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
                canvas.freeDrawingBrush.color = '#ffffff'; // Color ignored via composite op
                updateBrushSize();
            }
        }

        function updateBrushSize() {
            if(canvas.freeDrawingBrush) {
                canvas.freeDrawingBrush.width = parseInt(document.getElementById('brush-size').value, 10);
            }
        }

        // --- Core Workflow ---
        async function uploadToBackendFirst(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('upload-placeholder').style.display = 'none';
            document.getElementById('toolbar').style.display = 'flex';
            document.getElementById('btn-save').style.display = 'inline-block';
            
            // Reset state
            isImageModified = false;
            document.getElementById('btn-save').innerHTML = '<i class="fa-solid fa-check"></i> Done';
            setMode('drag');

            showLoading("Running Inference...");
            try {
                const formData = new FormData();
                formData.append('image', file);

                const response = await fetch('/api/fixer/extract', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                  if(!result.error) currentTextureUrl = result.textureUrl;
                
                if (result.error) {
                    showToast("Error: " + result.error, true);
                    hideLoading();
                    return;
                }

                fabric.Image.fromURL(result.textureUrl + "?t=" + new Date().getTime(), (img) => {
                    canvas.clear();
                    
                    const targetDim = 450;
                    const scale = Math.min(targetDim / img.width, targetDim / img.height);
                    
                    img.scale(scale);
                    
                    const offsetX = (512 - img.width * scale) / 2;
                    const offsetY = (512 - img.height * scale) / 2;

                    img.set({
                        left: offsetX,
                        top: offsetY,
                        selectable: false,
                        evented: false
                    });

                    mainImageObj = img;
                    canvas.add(img);

                    if(result.keypoints) {
                        drawKeypoints(result.keypoints, scale, offsetX, offsetY);
                    }
                    hideLoading();
                });

            } catch (err) {
                console.error(err);
                showToast("Failed to run inference.", true);
                hideLoading();
            }
        }

        function drawKeypoints(keypoints, scale, offsetX, offsetY) {
            kpPoints = {};
            kpLines = [];

            keypoints.forEach(kp => {
                const cx = (kp.x * scale) + offsetX;
                const cy = (kp.y * scale) + offsetY;

                const circle = new fabric.Circle({
                    radius: 6, fill: 'red', left: cx, top: cy,
                    originX: 'center', originY: 'center',
                    hasControls: false, hasBorders: false, selectable: true,
                    name: kp.name, parentName: kp.parent
                });
                
                const label = new fabric.Text(kp.name, {
                    fontSize: 10, fill: 'blue', left: cx + 8, top: cy - 8,
                    selectable: false, evented: false, originX: 'left', originY: 'bottom'
                });
                
                kpPoints[kp.name] = { circle, label, parentName: kp.parent };
                canvas.add(circle);
                canvas.add(label);
            });

            keypoints.forEach(kp => {
                if (kp.parent && kpPoints[kp.parent]) {
                    const p1 = kpPoints[kp.parent].circle;
                    const p2 = kpPoints[kp.name].circle;
                    
                    const line = new fabric.Line([p1.left, p1.top, p2.left, p2.top], {
                        stroke: 'rgba(255, 0, 0, 0.5)',
                        strokeWidth: 3, selectable: false, evented: false
                    });
                    
                    kpLines.push({ line, p1, p2 });
                    canvas.add(line);
                    line.sendToBack();
                }
            });
            
            if (mainImageObj) mainImageObj.sendToBack();

            canvas.on('object:moving', function(e) {
                isKeypointMoved = true;
                const obj = e.target;
                if (obj.type === 'circle' && obj.name) {
                    const kp = kpPoints[obj.name];
                    if (kp && kp.label) kp.label.set({ left: obj.left + 8, top: obj.top - 8 });
                    kpLines.forEach(l => {
                        if (l.p1 === obj) l.line.set({ x1: obj.left, y1: obj.top });
                        if (l.p2 === obj) l.line.set({ x2: obj.left, y2: obj.top });
                    });
                }
            });
        }
        
        function setSkeletonVisibility(visible) {
            Object.values(kpPoints).forEach(kp => {
                kp.circle.visible = visible;
                kp.label.visible = visible;
            });
            kpLines.forEach(l => {
                l.line.visible = visible;
            });
            canvas.renderAll();
        }

        function getCurrentKeypoints() {
            if (!kpPoints || Object.keys(kpPoints).length === 0) return null;
            let kps = [];
            for (let name in kpPoints) {
                kps.push({
                    name: name,
                    x: Math.round(kpPoints[name].circle.left),
                    y: Math.round(kpPoints[name].circle.top),
                    parent: kpPoints[name].parentName
                });
            }
            return kps;
        }

        async function processAndGoToEngine() {
            try {
                // If the user modified the image, we DO NOT send current keypoints. 
                // We re-infer them first!
                if (isImageModified) {
                    showLoading("Re-inferring skeleton from your drawn edits...");
                    
                    // We must be sure skeleton is invisible before taking dataURL
                    setSkeletonVisibility(false); 
                    const dataUrl = canvas.toDataURL({ format: 'png' });
                    const drawnBlob = await (await fetch(dataUrl)).blob();
                    
                    const extForm = new FormData();
                    extForm.append('image', drawnBlob, 'drawn_image.png');
                    
                    const extRes = await fetch('/api/fixer/extract', { method: 'POST', body: extForm });
                    const extData = await extRes.json();
                      if(!extData.error) currentTextureUrl = extData.textureUrl;
                    
                    if (extData.error) throw new Error("Extraction failed: " + extData.error);
                    
                    showLoading("Preparing Character for Engine...");
                    // Download the re-inferred texture to pass to save
                    const texBlob = await (await fetch(extData.textureUrl)).blob();
                    
                    const saveForm = new FormData();
                    saveForm.append('image', texBlob, 'final_char.png');
                    if (extData.keypoints) {
                        saveForm.append('keypoints', JSON.stringify(extData.keypoints));
                    }
                    
                    // Pass story slot so server generates only required motions
                    const _urlP1 = new URLSearchParams(window.location.search);
                    if (_urlP1.get('slot')) saveForm.append('slot', _urlP1.get('slot'));
                    
                    const saveRes = await fetch('/api/fixer/save', { method: 'POST', body: saveForm });
                    const saveData = await saveRes.json();
                    
                    if (saveData.success && saveData.jobId) {
                        // Poll for job completion
                        while(true) {
                            const jobRes = await fetch('/api/jobs/' + saveData.jobId);
                            const jobData = await jobRes.json();
                            showLoading(jobData.message || jobData.stage || "Loading...");
                            
                            if (jobData.status === 'COMPLETED') {
                                saveData.charDir = jobData.charDir;
                                break;
                            } else if (jobData.status === 'FAILED') {
                                throw new Error(jobData.error || "Job failed");
                            }
                            await new Promise(r => setTimeout(r, 1000));
                        }
                        sessionStorage.setItem('restore_textureUrl', currentTextureUrl);
                        sessionStorage.setItem('restore_keypoints', JSON.stringify(getCurrentKeypoints()));
                        
                        const urlParams = new URLSearchParams(window.location.search);
                        const returnUrl = urlParams.get('returnUrl');
                        const slot = urlParams.get('slot');
                        
                        hasSaved = true;
                        if (returnUrl && slot) {
                            sessionStorage.setItem('story_slot_' + slot, saveData.charDir);
                            window.location.href = returnUrl;
                        } else {
                            window.location.href = '/engine.html?charDir=' + encodeURIComponent(saveData.charDir);
                        }
                    } else {
                        throw new Error("Failed to prepare character after re-inference.");
                    }
                    
                } else {
                    // Normal path: just dragged keypoints
                    showLoading("Preparing Character for Engine...");
                    
                    setSkeletonVisibility(false); 
                    const dataUrl = canvas.toDataURL({ format: 'png' });
                    const blob = await (await fetch(dataUrl)).blob();
                    
                    const saveForm = new FormData();
                    saveForm.append('image', blob, 'fixed_char.png');
                    
                    const currentKps = getCurrentKeypoints();
                    if (currentKps) {
                        saveForm.append('keypoints', JSON.stringify(currentKps));
                    }
                    
                    // Pass story slot so server generates only required motions
                    const _urlP2 = new URLSearchParams(window.location.search);
                    if (_urlP2.get('slot')) saveForm.append('slot', _urlP2.get('slot'));
                    
                    const response = await fetch('/api/fixer/save', { method: 'POST', body: saveForm });
                    const result = await response.json();
                    
                    if (result.success && result.jobId) {
                        // Poll for job completion
                        while(true) {
                            const jobRes = await fetch('/api/jobs/' + result.jobId);
                            const jobData = await jobRes.json();
                            showLoading(jobData.message || jobData.stage || "Loading...");
                            
                            if (jobData.status === 'COMPLETED') {
                                result.charDir = jobData.charDir;
                                break;
                            } else if (jobData.status === 'FAILED') {
                                throw new Error(jobData.error || "Job failed");
                            }
                            await new Promise(r => setTimeout(r, 1000));
                        }
                        
                        sessionStorage.setItem('restore_textureUrl', currentTextureUrl);
                        sessionStorage.setItem('restore_keypoints', JSON.stringify(getCurrentKeypoints()));
                        
                        const urlParams = new URLSearchParams(window.location.search);
                        const returnUrl = urlParams.get('returnUrl');
                        const slot = urlParams.get('slot');
                        
                        hasSaved = true;
                        if (returnUrl && slot) {
                            sessionStorage.setItem('story_slot_' + slot, result.charDir);
                            window.location.href = returnUrl;
                        } else {
                            window.location.href = '/engine.html?charDir=' + encodeURIComponent(result.charDir);
                        }
                    } else {
                        throw new Error("Failed to prepare character.");
                    }
                }
            } catch(e) {
                console.error(e);
                showToast(e.message || "Failed to process image.", true);
                hideLoading();
            }
        }

        initCanvas();
    </script>
</body>
</html>
