<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Studio</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container" style="text-align: center; margin-top: 40px;">
        <header class="home-header">
            <h1 class="animate-bounce">Story Studio ✨</h1>
            
            <img src="/assets/welcome_storybook.jpg" alt="Magical Storybook" style="width: 200px; height: 200px; border-radius: 50%; object-fit: cover; margin: 20px auto; border: 4px solid var(--sunshine); box-shadow: 0 10px 15px rgba(0,0,0,0.1);">
            
        </header>

        <div class="cards-grid">
            <a href="/story.html" class="card story-card">
                <i class="fa-solid fa-wand-magic-sparkles" style="font-size: 3rem; color: var(--play-blue); margin-bottom: 15px;"></i>
                <h2>Make a Story</h2>
            </a>

            <a href="/fixer.html" class="card fixer-card">
                <i class="fa-solid fa-paintbrush" style="font-size: 3rem; color: #7e22ce; margin-bottom: 15px;"></i>
                <h2>Fix Drawing</h2>
            </a>
        </div>

        <div id="integration-banner" style="display: none; margin-top: 30px; padding: 15px; background: var(--mint); color: #16a34a; border-radius: 16px; font-weight: 700; border: 2px solid #86efac;">
            <i class="fa-solid fa-link" style="margin-right: 5px;"></i>
            Linked to EduVision
            <span id="assignment-context" style="display: none; margin-left: 10px; font-size: 0.9em; opacity: 0.8;"></span>
        </div>
    </div>

    <script>
        // Phase 3 & 4 Integration Context Extraction
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const assignmentId = params.get('assignmentId');

        if (token) {
            localStorage.setItem('eduvision_token', token);
            if (assignmentId) {
                localStorage.setItem('eduvision_assignment', assignmentId);
            }
            
            // Clean up the URL
            window.history.replaceState({}, document.title, "/");
        }

        // Show banner if integrated
        const savedToken = localStorage.getItem('eduvision_token');
        const savedAssignment = localStorage.getItem('eduvision_assignment');

        if (savedToken) {
            document.getElementById('integration-banner').style.display = 'block';
            if (savedAssignment) {
                const ctx = document.getElementById('assignment-context');
                ctx.textContent = `(Assignment ID: ${savedAssignment})`;
                // ctx.style.display = 'inline-block'; // hide assignment ID from kids
            }
        }
    </script>
</body>
</html>
