# YOLOv8-Pose Dataset Configuration for Sketch Humanoid Detection & Pose Estimation
path: ../datasets/sketch_humanoids # dataset root dir
train: images/train
val: images/val
test: images/test

# Keypoints specification
kpt_shape: [17, 3] # 17 keypoints, each with (x, y, visibility)

# Classes
names:
  0: humanoid

# Keypoint names matching COCO standard
keypoints:
  0: nose
  1: left_eye
  2: right_eye
  3: left_ear
  4: right_ear
  5: left_shoulder
  6: right_shoulder
  7: left_elbow
  8: right_elbow
  9: left_wrist
  10: right_wrist
  11: left_hip
  12: right_hip
  13: left_knee
  14: right_knee
  15: left_ankle
  16: right_ankle
